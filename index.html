<!doctype html>
<html lang="ko">
<head>
<title>속담 잇기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="속담 잇기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1D3A33;
    --felt-deep:#12261F;
    --bar:#0E1F1A;
    --ink:#ECE5D3;
    --ink-dim:#9FB3A8;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
    --good:#3E9B5B;
    --bad:#B5503C;
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .seg{display:flex;align-items:center;gap:6px}
  .seg .lbl{color:var(--ink-dim);font-size:17px;padding-right:2px;white-space:nowrap}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .stage{position:absolute;inset:0;background:var(--felt);display:flex;flex-direction:column;padding:16px 20px 18px;gap:2.2vmin}
  .top{display:flex;align-items:center;gap:14px;min-height:58px;padding-right:120px}
  .prog{font-size:20px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .prog b{color:var(--brass);font-size:24px}
  .stars{display:flex;gap:6px;flex-wrap:wrap}
  .stars i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-dim)}
  .stars i.ok{background:var(--brass);border-color:var(--brass)}
  .stars i.no{background:var(--bad);border-color:var(--bad)}
  .gear{
    position:absolute;right:12px;top:12px;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  /* 문제 — 앞부분을 크게 */
  .q{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;
    padding:2.4vmin 3vmin;border-radius:18px;background:var(--bar);border:1px solid var(--line);text-align:center
  }
  .q .front{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:clamp(34px,7.6vmin,72px);line-height:1.15;color:var(--ink);word-break:keep-all}
  .q .front .blank{color:var(--brass)}
  .q .say{font-size:clamp(16px,2.6vmin,22px);color:var(--ink-dim)}
  .choices{flex:1 1 auto;display:grid;grid-template-rows:repeat(3,1fr);gap:1.8vmin;min-height:0}
  .ch{
    display:flex;align-items:center;gap:2.2vmin;padding:0 3vmin;border-radius:16px;border:2px solid var(--line);
    background:var(--chip);color:var(--ink);font-family:inherit;font-weight:700;text-align:left;cursor:pointer;touch-action:manipulation;
    font-size:clamp(24px,5.2vmin,48px);line-height:1.15;word-break:keep-all;min-height:0
  }
  .ch .no{flex:0 0 auto;display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--brass);color:var(--brass-ink);font-size:.7em}
  .ch.right{background:var(--good);border-color:#8FD3A4;color:#fff}
  .ch.wrong{background:var(--bad);border-color:#E59A88;color:#fff}
  .ch.dim{opacity:.4}
  .bottom{display:flex;justify-content:flex-end;min-height:64px}
  .nextb{min-height:64px;padding:0 34px;font-size:24px}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(6,16,13,.55);overflow:auto;z-index:3}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card .big{margin:0;font-size:26px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  @media (prefers-reduced-motion:no-preference){
    .btn,.ch{transition:background .15s,border-color .15s,color .15s,opacity .2s}
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <div class="top">
      <span class="prog"><b id="qn">1</b> / <span id="qt">10</span></span>
      <div class="stars" id="stars"></div>
    </div>
    <section class="q" aria-live="polite">
      <div class="front" id="front"></div>
      <div class="say" id="say">이어지는 말을 골라 주세요</div>
    </section>
    <div class="choices" id="choices"></div>
    <div class="bottom"><button id="nextb" class="btn primary nextb" type="button" hidden>다음 문제 ▶</button></div>
    <button id="gear" class="btn gear" type="button">설정</button>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <div id="count" class="seg wide" role="group" aria-label="문제 수">
            <span class="lbl">문제</span>
            <button class="btn" type="button" data-v="5" aria-pressed="false">5개</button>
            <button class="btn" type="button" data-v="10" aria-pressed="true">10개</button>
            <button class="btn" type="button" data-v="15" aria-pressed="false">15개</button>
          </div>
          <button id="speak" class="btn" type="button" aria-pressed="true">읽어 주기</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="again" class="btn" type="button">처음부터</button>
          <button id="full" class="btn" type="button">전체 화면</button>
        </div>
        <p class="note">속담 앞부분을 보고 이어지는 말을 골라요. 틀려도 정답을 알려 주고 넘어가요.</p>
        <button id="menuClose" class="btn primary" type="button">닫고 하기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>잘하셨어요!</h2>
        <p class="big" id="dScore"></p>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const PREFS = 'proverb.prefs', SEEN = 'proverb.bag';
  // 속담: [앞부분, 뒷부분]
  const P = [
    ['가는 말이 고와야', '오는 말이 곱다'], ['낮말은 새가 듣고', '밤말은 쥐가 듣는다'], ['발 없는 말이', '천 리 간다'],
    ['세 살 버릇', '여든까지 간다'], ['소 잃고', '외양간 고친다'], ['원숭이도', '나무에서 떨어진다'],
    ['티끌 모아', '태산'], ['백지장도', '맞들면 낫다'], ['돌다리도', '두들겨 보고 건너라'],
    ['떡 줄 사람은 생각도 않는데', '김칫국부터 마신다'], ['고래 싸움에', '새우 등 터진다'], ['가랑비에', '옷 젖는 줄 모른다'],
    ['개구리', '올챙이 적 생각 못 한다'], ['열 번 찍어', '안 넘어가는 나무 없다'], ['웃는 얼굴에', '침 못 뱉는다'],
    ['하룻강아지', '범 무서운 줄 모른다'], ['호랑이도', '제 말 하면 온다'], ['호랑이 굴에 들어가야', '호랑이 새끼를 잡는다'],
    ['가는 날이', '장날'], ['누워서', '떡 먹기'], ['등잔 밑이', '어둡다'],
    ['금강산도', '식후경'], ['그림의', '떡'], ['꿩 먹고', '알 먹는다'],
    ['도토리', '키 재기'], ['말 한마디로', '천 냥 빚을 갚는다'], ['믿는 도끼에', '발등 찍힌다'],
    ['바늘 도둑이', '소도둑 된다'], ['뛰는 놈 위에', '나는 놈 있다'], ['사공이 많으면', '배가 산으로 간다'],
    ['서당 개 삼 년이면', '풍월을 읊는다'], ['식은 죽', '먹기'], ['아니 땐 굴뚝에', '연기 날까'],
    ['우물 안', '개구리'], ['윗물이 맑아야', '아랫물이 맑다'], ['작은 고추가', '맵다'],
    ['제 눈에', '안경'], ['지렁이도 밟으면', '꿈틀한다'], ['천 리 길도', '한 걸음부터'],
    ['콩 심은 데 콩 나고', '팥 심은 데 팥 난다'], ['같은 값이면', '다홍치마'], ['구슬이 서 말이라도', '꿰어야 보배'],
    ['남의 떡이', '더 커 보인다'], ['되로 주고', '말로 받는다'], ['꼬리가 길면', '밟힌다'],
    ['빈 수레가', '요란하다'], ['쥐구멍에도', '볕 들 날 있다'], ['가지 많은 나무에', '바람 잘 날 없다'],
    ['급할수록', '돌아가라'], ['낫 놓고', '기역 자도 모른다'], ['보기 좋은 떡이', '먹기도 좋다'],
    ['비 온 뒤에', '땅이 굳는다'], ['벼는 익을수록', '고개를 숙인다'], ['시작이', '반이다'],
    ['아는 길도', '물어 가라'], ['오르지 못할 나무는', '쳐다보지도 마라'], ['옷이', '날개'],
    ['울며', '겨자 먹기'], ['닭 쫓던 개', '지붕 쳐다본다'], ['남의 잔치에', '감 놔라 배 놔라 한다'],
    ['목마른 사람이', '우물 판다'], ['배보다', '배꼽이 더 크다'], ['수박', '겉 핥기'],
    ['꿈보다', '해몽'], ['똥 묻은 개가', '겨 묻은 개 나무란다'], ['누워서', '침 뱉기'],
    ['병 주고', '약 준다'], ['미운 아이', '떡 하나 더 준다'], ['불난 집에', '부채질한다'],
    ['산 넘어', '산'], ['십 년이면', '강산도 변한다'], ['열 길 물속은 알아도', '한 길 사람 속은 모른다'],
    ['젊어서 고생은', '사서도 한다'], ['친구 따라', '강남 간다'], ['피는', '물보다 진하다'],
    ['하늘이 무너져도', '솟아날 구멍이 있다'], ['형만 한', '아우 없다'], ['개천에서', '용 난다'],
    ['공든 탑이', '무너지랴'], ['귀에 걸면 귀걸이', '코에 걸면 코걸이'], ['될성부른 나무는', '떡잎부터 알아본다'],
    ['말이', '씨가 된다'], ['모로 가도', '서울만 가면 된다'], ['바늘 가는 데', '실 간다'],
    ['백문이', '불여일견'], ['달면 삼키고', '쓰면 뱉는다'], ['제 버릇', '개 못 준다'],
    ['가재는', '게 편'], ['그 아버지에', '그 아들'], ['찬물도', '위아래가 있다'],
    ['오는 정이 있어야', '가는 정이 있다'], ['물에 빠지면', '지푸라기라도 잡는다'], ['아는 것이', '힘'],
    ['어물전 망신은', '꼴뚜기가 시킨다'], ['자라 보고 놀란 가슴', '솥뚜껑 보고 놀란다'], ['서울 가서', '김 서방 찾기']
  ];

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let prefs = { count: 10, speak: true, sound: true };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));

  // 최근에 나온 속담은 한 바퀴 돌 때까지 다시 안 나오게
  let bag = [];
  try { bag = (JSON.parse(store.get(SEEN) || '[]') || []).filter(i => i >= 0 && i < P.length); } catch(e){}
  function draw(){
    if (!bag.length) bag = shuffle(P.map((_, i) => i));
    const i = bag.pop(); store.set(SEEN, JSON.stringify(bag));
    return i;
  }

  let R = null;
  function newRound(){
    R = { qs: [], at: 0, score: 0, marks: [] };
    for (let k = 0; k < prefs.count; k++) R.qs.push(draw());
    $('#qt').textContent = prefs.count;
    const st = $('#stars'); st.textContent = '';
    for (let k = 0; k < prefs.count; k++) st.appendChild(document.createElement('i'));
    $('#done').hidden = true; $('#menu').hidden = true;
    show();
  }
  function show(){
    const i = R.qs[R.at], [front, back] = P[i];
    R.ans = false;
    $('#qn').textContent = R.at + 1;
    $('#front').innerHTML = `${front} <span class="blank">…</span>`;
    $('#say').textContent = '이어지는 말을 골라 주세요';
    $('#nextb').hidden = true;
    // 틀린 보기: 다른 속담의 뒷부분 (앞부분이 같은 속담은 빼서 답이 두 개가 되지 않게)
    const others = shuffle(P.map((_, j) => j).filter(j => P[j][0] !== front && P[j][1] !== back));
    const opts = shuffle([back, P[others[0]][1], P[others[1]][1]]);
    const box = $('#choices'); box.textContent = '';
    opts.forEach((t, k) => {
      const b = document.createElement('button');
      b.className = 'ch'; b.type = 'button'; b.dataset.t = t;
      b.innerHTML = `<span class="no">${k+1}</span><span></span>`;
      b.lastChild.textContent = t;
      box.appendChild(b);
    });
    say(front);
  }
  $('#choices').addEventListener('click', e => {
    const b = e.target.closest('.ch');
    if (!b || !R || R.ans) return;
    wakeAudio();
    R.ans = true;
    const [front, back] = P[R.qs[R.at]], ok = b.dataset.t === back;
    for (const c of $('#choices').children){
      if (c.dataset.t === back) c.classList.add('right');
      else if (c === b) c.classList.add('wrong');
      else c.classList.add('dim');
    }
    if (ok){ R.score++; [659, 880].forEach((f, i) => setTimeout(() => beep(f, .14), i*120)); }
    else beep(220, .18);
    $('#stars').children[R.at].classList.add(ok ? 'ok' : 'no');
    $('#front').textContent = `${front} ${back}`;
    $('#say').textContent = ok ? '맞았어요!' : '정답은 초록색이에요';
    say(`${front} ${back}`);
    $('#nextb').textContent = R.at + 1 < R.qs.length ? '다음 문제 ▶' : '결과 보기 ▶';
    $('#nextb').hidden = false;
  });
  $('#nextb').addEventListener('click', () => {
    if (!R || !R.ans) return;
    if (++R.at < R.qs.length) show();
    else finish();
  });
  function finish(){
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    $('#dScore').textContent = `${R.qs.length}문제 중 ${R.score}개 맞혔어요`;
    $('#done').hidden = false;
    say(`${R.qs.length}문제 중 ${R.score}개 맞혔어요`);
  }

  // ---------- 읽어 주기 (기기 음성) ----------
  function say(text){
    if (!prefs.speak || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = .85;
      const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch(e){}
  }

  // ---------- 소리 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }

  // ---------- 설정 ----------
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  function syncSeg(){ for (const b of $('#count').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.count); }
  $('#count').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.count) return;
    prefs.count = +b.dataset.v; savePrefs(); syncSeg(); newRound();
  });
  $('#speak').addEventListener('click', e => {
    prefs.speak = !prefs.speak; savePrefs(); toggle(e.currentTarget, prefs.speak);
    if (!prefs.speak && 'speechSynthesis' in window) speechSynthesis.cancel(); else say('읽어 드릴게요');
  });
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#again').addEventListener('click', newRound);
  $('#doneAgain').addEventListener('click', newRound);
  $('#gear').addEventListener('click', () => { $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
    } catch(e){}
    $('#menu').hidden = true;
  });
  // 기기가 음성을 늦게 불러오는 경우가 있어 한 번 깨워 둔다
  if ('speechSynthesis' in window){ try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e){} }

  toggle($('#speak'), prefs.speak); toggle($('#sound'), prefs.sound); syncSeg();
  newRound();
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
